name: Build Project from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project.zip
      run: |
        # Распаковываем твой новый архив
        unzip project.zip -d project_files
        echo "=== Содержимое корня ==="
        ls -la project_files
        echo "=== Ищем Android.mk ==="
        find project_files -name "Android.mk"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with ndk-build
      run: |
        cd project_files
        
        # Ищем путь к Android.mk
        MK_PATH=$(find . -name "Android.mk" | head -n 1)
        
        if [ -z "$MK_PATH" ]; then
          echo "Ошибка: Файл Android.mk не найден!"
          exit 1
        fi
        
        # Определяем папку, где лежит Android.mk (обычно это папка jni)
        JNI_DIR=$(dirname "$MK_PATH")
        echo "Нашли Android.mk в: $JNI_DIR"
        
        # Переходим в корень проекта (на уровень выше папки jni)
        cd "$JNI_DIR/.."
        
        # Запускаем сборку
        echo "Запускаем сборку..."
        ndk-build APP_ABI="arm64-v8a"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Libraries
        # Забираем все собранные .so файлы
        path: "**/libs/arm64-v8a/*"
